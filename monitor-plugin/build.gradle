// 注意 任务中publishPlugin 是发布到gradle门户 publishPluginMavenPublicationToMavenRepository
if (VERSION_NAME.contains("-LOCAL")) {
    //gradle publishMavenPublicationToMavenRepository
    publishing {
        publications { PublicationContainer publication ->
            maven(MavenPublication) {
                version VERSION_NAME
                artifactId 'monitor-plugin'
                groupId 'io.github.mahongyin.'+rootProject.name
                from components.java
//            from components.release
            }
        }
        repositories { RepositoryHandler handler ->
            handler.maven { MavenArtifactRepository mavenArtifactRepository -> //正式仓库
                //上传到项目本地仓库
                url '..\\localmaven' //MAVEN_URL //
                if (url.toString().startsWith("http")) {
                    allowInsecureProtocol = true
                    credentials {
                        username = MAVEN_USER
                        password = MAVEN_PASSWORD
                    }
                }
            }
        }
    }
} else {
// maven方式 gradle publishToMavenCentral
    mavenPublishing {
        // 配置坐标,参数一要和命名空间一致，参二为模块名(GroupId),参三为版本号 "1.0.0"
        coordinates(
                "io.github.mahongyin.Monitor",
                "monitor-plugin",
                VERSION_NAME)

        pom {
            name = "Monitor"
            description = "An Http inspector for OkHttp & Retrofit"
            inceptionYear = "2025"
            url = "https://github.com/mahongyin/Monitor"
            licenses {
                license {
                    name = "The Apache License, Version 2.0"
                    url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
//                name = "LGPL-3.0 license"
//                url = "https://www.gnu.org/licenses/lgpl-3.0.html"
//                distribution = "https://www.gnu.org/licenses/lgpl-3.0.html"
                }
            }
            developers {
                developer {
                    id = "mahongyin"
                    name = "mahongyin"
                    url = "https://github.com/mahongyin"
                }
            }
            scm {
                url = "https://github.com/mahongyin/Monitor"
                connection = "scm:git:git://github.com/mahongyin/Monitor.git"
                developerConnection = "scm:git:ssh://git@github.com/mahongyin/Monitor.git"
            }
        }
    }
}