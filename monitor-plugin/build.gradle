// 确保源码被正确编译和打包
sourceSets {
    main {
        java {
            srcDirs = ['src/main/kotlin']
        }
    }
}
dependencies {
//    implementation gradleApi()
//    implementation localGroovy()

    //AGP9 要Java21
    compileOnly 'com.android.tools.build:gradle:9.0.0'
    //AGP8 要Java17
    //compileOnly 'com.android.tools.build:gradle-api:8.3.0'
    //ASM
    implementation 'org.ow2.asm:asm:9.8'
    implementation 'org.ow2.asm:asm-util:9.8'
    implementation 'org.ow2.asm:asm-commons:9.8'

    //常用io操作
//    implementation "commons-io:commons-io:2.13.0"

}
//  获取项目名
def projectName = rootProject.name  //分享git是取的项目名
def projectDirName = rootProject.projectDir.name//def projectName =rootProject.rootDir.name//项目文件夹名
//  获取当前模块名
def moduleName = project.name
def moduleDirName = projectDir.name

def gitRepo = "github.com/mahongyin"
def groupName = "io.github.mahongyin.$projectName" //自行分辨 用项目名还是目录名

def VERSION_NAME = libs.versions.monitor.publishing.get()

//需要version和group
group = groupName //"io.github.mahongyin.Monitor"
version = VERSION_NAME

//强制要求 pluginId 和 groupId 相同。...
// 发布到maven时把下面注掉、发布gradle门户把下面解注
