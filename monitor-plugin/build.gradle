//        monitor {// "monitor"是一个内部标识符，可以自定义//指定插件 ID 和入口
//            id = "io.github.mahongyin.Monitor.monitor-plugin"// 此处定义的才是真正的插件ID
//            implementationClass = "github.mahongyin.monitor.plugin.MonitorPlugin"
//            displayName = "MonitorPlugin"
//            description = "Gradle plugin to Monitor Net!"
//            tags.set(['android', 'monitor', 'okhttp', 'mahongyin'])
//        }
//        //... 还可以再加
//    }
//}

// TODO 发布到maven时把下面注掉、发布gradle门户把下面解注
gradlePlugin {
    website.set("https://${gitRepo}/Monitor")
    vcsUrl.set("https://${gitRepo}/Monitor")
    plugins {
        create("monitor") { // "monitor"是一个内部标识符，可以自定义
            id = "${groupName}.${moduleName}"// 此处定义的才是真正的插件ID
            implementationClass = "github.mahongyin.monitor.plugin.MonitorPlugin"
            displayName = "MonitorPlugin"
            description = "A plugin for monitoring Android OkHttp"
            tags.set(["android", "monitor", "okhttp", "mahongyin"])//listOf()
        }
        //... 还可以再加
        //register("xxxx") {}
    }
}

// 注意 任务中publishPlugin 是发布到gradle门户 publishPluginMavenPublicationToMavenRepository
if (VERSION_NAME.contains("-LOCAL")) {
    //gradle publishMavenPublicationToMavenRepository
    publishing {
        publications { PublicationContainer publication ->
            maven(MavenPublication) {
                version VERSION_NAME
                artifactId moduleName
                groupId groupName
                from components.java
//            from components.release
            }
        }
        repositories { RepositoryHandler handler ->
            handler.maven { MavenArtifactRepository mavenArtifactRepository -> //正式仓库
                //上传到项目本地仓库
                url '..\\localmaven' //MAVEN_URL //
                if (url.toString().startsWith("http")) {
                    allowInsecureProtocol = true
                    credentials {
                        username = MAVEN_USER
                        password = MAVEN_PASSWORD
                    }
                }
            }
        }
    }
} else {
// maven方式 gradle publishToMavenCentral
    mavenPublishing {
        // 配置坐标,参数一要和命名空间一致，参二为模块名(GroupId),参三为版本号 "1.0.0"
        coordinates(
                groupName,
                moduleName,
                VERSION_NAME)

        pom {
            name = "Monitor"
            description = "An Http inspector for OkHttp & Retrofit"
            inceptionYear = "2025"
            url = "https://${gitRepo}/Monitor"
            licenses {
                license {
                    name = "The Apache License, Version 2.0"
                    url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
//                name = "LGPL-3.0 license"
//                url = "https://www.gnu.org/licenses/lgpl-3.0.html"
//                distribution = "https://www.gnu.org/licenses/lgpl-3.0.html"
                }
            }
            developers {
                developer {
                    id = "mahongyin"
                    name = "mahongyin"
                    url = "https://${gitRepo}"
                }
            }
            scm {
                url = "https://${gitRepo}/Monitor"
                connection = "scm:git:git://${gitRepo}/Monitor.git"
                developerConnection = "scm:git:ssh://git@${gitRepo}/Monitor.git"
            }
        }
    }
}