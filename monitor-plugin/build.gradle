// 确保源码被正确编译和打包
sourceSets {
    main {
        java {
            srcDirs = ['src/main/kotlin']
        }
    }
}
dependencies {
//    implementation gradleApi()
//    implementation localGroovy()

    // Java17+
//    implementation 'com.android.tools.build:gradle:8.3.0' //考虑兼容Java11  AGP8 要Java17
    compileOnly 'com.android.tools.build:gradle-api:8.3.0'
    //ASM
    implementation 'org.ow2.asm:asm:9.6'
    implementation 'org.ow2.asm:asm-util:9.6'
    implementation 'org.ow2.asm:asm-commons:9.6'

    //常用io操作
//    implementation "commons-io:commons-io:2.13.0"

}

def VERSION_NAME = libs.versions.monitor.publishing.get()

//需要version和group
group = "io.github.mahongyin.Monitor"
version = VERSION_NAME
//强制要求 pluginId 和 groupId 相同。...
//TODO 发布到maven把下面注掉、发布gradle把下面解注
gradlePlugin {
    website = 'https://github.com/mahongyin/Monitor'
    vcsUrl = 'https://github.com/mahongyin/Monitor'
    plugins {
        monitor {// "monitor"是一个内部标识符，可以自定义//指定插件 ID 和入口
            id = "io.github.mahongyin.Monitor.monitor-plugin"// 此处定义的才是真正的插件ID
            implementationClass = "github.mahongyin.monitor.plugin.MonitorPlugin"
            displayName = "MonitorPlugin"
            description = "Gradle plugin to Monitor Net!"
            tags.set(['android', 'monitor', 'okhttp', 'mahongyin'])
        }
        //... 还可以再加
    }
}
