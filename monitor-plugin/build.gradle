plugins {
    //id 'java'
    id 'groovy'
    id 'kotlin'
    //配置这个，gradlePlugin{}用否则找不到 org.gradle.api.Plugin 等
    id("groovy-gradle-plugin")
//    id("java-gradle-plugin")
    id 'com.vanniktech.maven.publish'
    id 'com.gradle.plugin-publish' version '2.0.0'
    id 'maven-publish'
}

